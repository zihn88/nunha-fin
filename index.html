<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no">
    <meta name="theme-color" content="#ffffff">
    <title>Nunha Fin</title>
    
    <!-- Memanggil file manifest -->
    <link rel="manifest" href="manifest.json">
    <link rel="icon" href="https://cdn-icons-png.flaticon.com/512/9139/9139457.png">
    <link rel="apple-touch-icon" href="https://cdn-icons-png.flaticon.com/512/9139/9139457.png">
    
    <style>
        body, html { margin: 0; padding: 0; width: 100%; height: 100%; overflow: hidden; background-color: #ffffff; }
        iframe { border: none; width: 100%; height: 100vh; display: block; }
    </style>
</head>
<body>
    <!-- URL GAS ANDA -->
    <iframe src="https://script.google.com/macros/s/AKfycbx0QNY3f0K62Hb5U8kxD08yCIb53wsEJaZNXwvpbvBbpxLVOlbfDSsbj7w1OmJ3744Z/exec"></iframe>

    <!-- Wajib ada untuk mendaftarkan Service Worker -->
    <script>
        if ('serviceWorker' in navigator) {
            window.addEventListener('load', () => {
                navigator.serviceWorker.register('sw.js')
                .then(reg => console.log('Service Worker sukses terdaftar!'))
                .catch(err => console.error('Service Worker error:', err));
            });
        }
    </script>
</body>
</html>
